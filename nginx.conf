server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Service worker: nunca cachear, senão o app fica preso numa versão antiga.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets com hash no nome (Vite) podem ser cacheados por muito tempo.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy do gateway de pagamento (VPS externo, HTTP puro).
    # Reproduz o rewrite que hoje vive no vercel.json: sem isso, uma pagina
    # servida em HTTPS ficaria bloqueada pelo navegador (mixed content) ao
    # chamar http:// direto.
    location /api/payment-vps/ {
        proxy_pass http://168.231.98.99:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA: qualquer rota que nao seja arquivo real cai no index.html.
    location / {
        try_files $uri /index.html;
    }
}
