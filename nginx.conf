server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Service worker: nunca cachear, senão o app fica preso numa versão antiga.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets com hash no nome (Vite) podem ser cacheados por muito tempo.
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Paginas estaticas servidas sem a extensao .html (ex: /privacy -> privacy.html).
    # Precisa vir antes do bloco SPA, senao /privacy cairia no index.html.
    location / {
        try_files $uri $uri.html /index.html;
    }
}
