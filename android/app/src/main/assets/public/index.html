  <!-- Failsafe: Remove splash screen after 3 seconds -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function () {
            splash.remove();
          }, 500);
        }
      }, 3000);
    });
  </script>
