  <!-- Redireciona /privacy para a pagina estatica de politica de privacidade.
       Roda antes de tudo para o caso de o servidor (nginx antigo em cache no
       Coolify) mandar /privacy pro SPA em vez de servir /privacy.html direto.
       No Firebase o rewrite ja resolve isso e este script nem chega a rodar. -->
  <script>
    (function () {
      var p = location.pathname.replace(/\/+$/, '');
      if (p === '/privacy') { location.replace('/privacy.html'); }
    })();
  </script>

  <script>
    // DEBUG: Mostra erros na tela (útil pra depurar em celular sem DevTools).
    // Antes isso desenhava uma faixa vermelha sólida cobrindo a tela inteira e
    // repetia a MESMA mensagem uma linha por ocorrência (ex.: um erro de
    // script de terceiro disparando 5x virava 5 linhas idênticas), deixando
    // telas como o painel admin ilegíveis. Agora fica num rodapé retrátil,
    // agrupa mensagens repetidas (mostra "(x5)" em vez de repetir) e pode
    // ser fechado.
    (function () {
      var counts = Object.create(null);
      var rows = Object.create(null);
      var panel = null;
      var list = null;

      function ensurePanel() {
        if (panel) return panel;
        panel = document.createElement('div');
        panel.id = 'err-debug';
        panel.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:35vh;overflow-y:auto;background:rgba(120,0,0,0.95);color:#fff;z-index:999999;padding:12px 40px 12px 12px;font:12px/1.4 monospace;white-space:pre-wrap;';
        var close = document.createElement('button');
        close.textContent = '✕';
        close.title = 'Fechar';
        close.style.cssText = 'position:absolute;top:4px;right:8px;background:transparent;border:0;color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:4px 8px;';
        close.onclick = function () {
          panel.remove();
          panel = null;
          list = null;
          counts = Object.create(null);
          rows = Object.create(null);
        };
        list = document.createElement('div');
        panel.appendChild(close);
        panel.appendChild(list);
        document.body.appendChild(panel);
        return panel;
      }

      function report(text) {
        ensurePanel();
        var n = (counts[text] || 0) + 1;
        counts[text] = n;
        var row = rows[text];
        if (!row) {
          row = document.createElement('div');
          rows[text] = row;
          list.appendChild(row);
        }
        row.textContent = (n > 1 ? '(x' + n + ') ' : '') + text;
      }

      window.onerror = function (msg, url, line) {
        report('[JS ERROR] ' + msg + ' (' + url + ':' + line + ')');
      };
      window.addEventListener('unhandledrejection', function (e) {
        report('[PROMISE] ' + e.reason);
      });
    })();
  </script>
  <script type="module">
    try {

    } catch (e) {
      console.log("Environment variable bridge skipped");
    }
  </script>

  <!-- Failsafe: Remove splash screen after 3 seconds -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var splash = document.getElementById('splash-screen');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function () {
            splash.remove();
          }, 500);
        }
      }, 3000);
    });
  </script>
